name: Stock monitor

# Manual only: the monitor runs on a home PC. Running it here at the same time
# doubles the requests to Amazon (GitHub's IPs get blocked quickly) and breaks
# the Telegram buttons, since only one copy can receive them.
# To run here instead of the PC, add back:
#   schedule:
#     - cron: "*/15 * * * *"
on:
  workflow_dispatch:

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL: ${{ vars.CHECK_INTERVAL || '2' }}
          MAX_RUNTIME: "21000"
          STARTUP_MESSAGE: "0"
